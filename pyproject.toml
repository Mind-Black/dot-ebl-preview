[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dot-ebl-preview"
version = "0.1.0"
description = "Combined hologram optical preview and Raith EBL layout application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22",
    "pillow>=9.0",
]

[project.optional-dependencies]
full = [
    "scipy",
    "opencv-python",
    "pygame",
    "PyOpenGL",
    "matplotlib",
]
dev = [
    "pytest>=7.0",
]
gui-build = [
    "pyinstaller",
]
gui = [
    "glfw>=2.10",
    "PyOpenGL>=3.1",
]

[project.scripts]
dot-ebl = "dot_ebl_preview.cli:main"
dot-ebl-gui = "dot_ebl_preview.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
